apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-gitops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Matlaba-Machaka/gitops-manifests-repo' 
    targetRevision: HEAD
    path: '.' 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true 
      selfHeal: true
