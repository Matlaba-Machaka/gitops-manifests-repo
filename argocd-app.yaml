apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-gitops-app
  namespace: argocd
spec:
  project: default
  source:
    # FIXED: Replaced truncated placeholder with your explicit GitOps repository URL
    repoURL: 'https://github.com'
    targetRevision: HEAD
    path: '.' # Scans the root directory of your repository for your deployment.yaml
  destination:
    # FIXED: Replaced placeholder with the standard local cluster API registration host
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true     # Automatically purges cluster resources if removed from Git
      selfHeal: true  # Instantly overwrites out-of-band manual changes to match Git
