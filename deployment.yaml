apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-app
  template:
    metadata:
      labels:
        app: gitops-app
  spec:
    containers:
    - name: web-app
      image: acrgitopsprod15524.azurecr.io/myapp:ce22be6ca03584e6467a87ceb656d34e6e92c8ba
      ports:
      - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-app-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: gitops-app